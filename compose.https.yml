services:
  server:
    environment:
      NINESYNC_COOKIE_SECURE: "true"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NINESYNC_DOMAIN: ${NINESYNC_DOMAIN:?Set your hostname in .env, for example sync.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - nine_sync_caddy_data:/data
      - nine_sync_caddy_config:/config

volumes:
  nine_sync_caddy_data:
  nine_sync_caddy_config:
